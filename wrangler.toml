"$schema" = "./node_modules/wrangler/config-schema.json"

## This Wrangler configuration file is an example configuration
## While using Steels Portal, a custom configuration file is created that resembles this 
## one, but with custom configuration values for each different gateway.
## The values shown here are just an example for testing purposes.

name = "api-gateway" # usually the name of the gateway for each user
main = "src/index.ts"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

analytics_engine_datasets = [
  { binding = "API_ANALYTICS" }
]

[vars] # local testing stuff, the production values are set from the API server
GATEWAY_NAME = "api-gateway"
ANALYTICS_ENABLED = "true"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
